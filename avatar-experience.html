<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar interativo – Lucas Martinez</title>
<style>
:root{--bg:#050b1c;--fg:#e8efff;--mut:#8fa3d6;--blue:#2f6bff;--glow:#3d8bff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:var(--fg);
  background:radial-gradient(ellipse at 72% 45%,#0c1f5c 0%,var(--bg) 62%);
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{display:grid;grid-template-columns:1fr minmax(260px,420px);gap:48px;align-items:center;max-width:1000px;width:100%}
h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:.98;margin:0 0 16px;letter-spacing:-.03em}
.sub{color:var(--mut);margin:0;max-width:34ch;line-height:1.5}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,rgba(61,139,255,.35),rgba(61,139,255,0) 68%);
  box-shadow:0 0 0 1px rgba(61,139,255,.35),0 0 60px rgba(47,107,255,.35)}
#avatar{display:block;width:100%;height:100%;cursor:pointer;outline-offset:6px;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none}
#avatar:focus-visible{outline:2px solid var(--glow)}
.hud{margin-top:18px;font-size:.8rem;color:var(--mut);min-height:2.6em}
.hud b{color:var(--fg);font-weight:600}
@media(max-width:720px){.hero{grid-template-columns:1fr;text-align:center;gap:24px}
  .stage{order:-1;margin:0 auto;max-width:340px}.sub{margin:0 auto}}
</style>

<!-- Modos: demonstração completa ou incorporação discreta no portfolio. -->
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('avatar-embed');</script>
<style>
html.avatar-embed, html.avatar-embed body {margin:0;width:100%;height:100%;min-height:0;overflow:hidden;background:transparent;padding:0;}
html.avatar-embed body {display:flex;align-items:center;justify-content:center;}
html.avatar-embed .hero {display:flex;align-items:center;justify-content:center;max-width:none;width:100%;height:100%;gap:0;padding:0;}
html.avatar-embed .hero>div:first-child {display:none;}
html.avatar-embed .stage {flex:none;width:min(92vw,92vh,420px);height:auto;aspect-ratio:1;margin:0;background:radial-gradient(circle,rgba(61,139,255,.16),transparent 70%);box-shadow:none;}
html.avatar-embed #avatar {cursor:default;}
@media(prefers-reduced-motion:reduce){html.avatar-embed .stage {transition:none;animation:none;}}
</style>
</head>
<body>
<main class="hero">
  <div>
    <h1>Lucas<br>Martinez</h1>
    <p class="sub">Desenvolvimento de software, automação e dados aplicados à logística.</p>
    <p class="hud">Passe devagar pelo rosto para fazer carinho.<br>Um movimento agitado muda o humor.<br><span id="hud"></span></p>
  </div>
  <div class="stage">
    <canvas id="avatar" role="button" tabindex="0"
      aria-label="Avatar interativo do Lucas. Passe o cursor ou o dedo sobre o rosto. Enter para sorrir; Shift e Enter para corações.">Avatar interativo de Lucas Martinez.</canvas>
  </div>
</main>

<script>
/* =====================================================================
   AvatarInterativo — JavaScript puro; mesmas 14 poses, sem dependências.
   Velocidades: larguras do canvas por segundo (independem da resolução).
   Tempos: milissegundos. Parallax: pixels CSS; inclinação: graus.

   Um único requestAnimationFrame resolve todos os prazos. Não há setTimeout
   nem setInterval. Chame destroy() antes de remover/substituir o componente.
   Uso: new AvatarInterativo(canvas, { pasta: 'avatar/' }).carregar();
   ===================================================================== */
const POSES = ['rest','closed','half','up','down','left','right','upleft','upright','downleft','downright','grin','hearts','angry'];
const SETORES = ['right','downright','down','downleft','left','upleft','up','upright'];
const VETOR = {rest:[0,0],right:[1,0],left:[-1,0],up:[0,-1],down:[0,1],
  upleft:[-.7,-.7],upright:[.7,-.7],downleft:[-.7,.7],downright:[.7,.7]};
const rand = (a,b) => a + Math.random() * (b-a);
const limitar = (v,a,b) => Math.max(a,Math.min(b,v));

class AvatarInterativo {
  constructor(canvas, opcoes = {}) {
    Object.assign(this, {
      pasta: 'avatar/', ext: 'webp', fontes: null, tamanho: 600,
      centroX: .5, centroY: .45, zonaMorta: .10,
      raioRostoX: .32, raioRostoY: .36,

      // Carinho: movimento lento, contínuo e dentro da elipse do rosto.
      carinhoVelMin: .03, carinhoVelMax: .85,
      carinhoApos: 800, carinhoTolerancia: 160, carinhoRetorno: 1000,

      // Bravo exige tempo em alta velocidade E mudanças de direção.
      bravoVelMin: 1.8, bravoApos: 600, bravoJanela: 950,
      bravoMudancas: 3, bravoAngulo: 75, bravoRetorno: 650,
      intervaloMudancas: 80,

      entradaDuracao: 1200, entradaIntervalo: 0,
      fixoApos: 2000, limiarParado: .008, saidaRetorno: 1000,
      amostraMin: 16, amostraMax: 160, ruidoMovimento: .002,
      idleApos: 4000, idleIntervalo: [1650,3250],
      piscadaIntervalo: [2300,5900], piscadaFixaIntervalo: [4400,7700],
      piscadaDuracoes: [65,100,65], piscadaFixaDuracoes: [105,155,105],

      // Movimento natural: cabeça flutua de leve; sem deformar rosto/olhos.
      respiracao: .008, respiracaoPeriodo: 5100,
      parallax: 8, inclinacao: 3.4, suavizacao: 180, crossfade: 145,
      toqueMax: 280, toqueMovMax: .04, duploToqueIntervalo: 320,
      cliqueDuracao: 1200, duploCliqueDuracao: 1800,
      onPose: null
    }, opcoes);
    if (!canvas || typeof canvas.getContext !== 'function') throw new TypeError('Informe um canvas válido.');
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    if (!this.ctx) throw new Error('Canvas 2D indisponível neste navegador.');
    this.img = {};
    this.dir = 'rest'; this.emocao = null; this.piscada = null; this.atual = null;
    this.modoTeste = true; this.fixo = false;
    this.destruido = false; this._pronto = false; this._raf = null;
    this._limpezas = []; this._cargas = new Set();
    this._origem = document.createElement('canvas');
    this._destino = document.createElement('canvas');
    this._estilo = {
      transform: canvas.style.transform,
      touchAction: canvas.style.touchAction,
      willChange: canvas.style.willChange
    };
    canvas.style.touchAction = 'none'; // Somente o canvas; a página continua rolando.
    this._media = matchMedia('(prefers-reduced-motion: reduce)');
    this.reduzir = this._media.matches;
    this._ponteiro = null; this._dentro = false; this._pressionado = null;
    this._parallaxX = 0; this._parallaxY = 0;
    this._velocidadeX = 0; this._velocidadeY = 0;
    this._olharX = 0; this._olharY = 0; this._olharPose = 'rest';
    this._olharCandidato = null; this._olharCandidatoDesde = 0;
    this._visivel = true; this._duplaPiscada = false; this._segundaPiscada = false;
    this._saidaEm = null; this._sorrisoAte = 0; this._carinhoAte = 0; this._bravoAte = 0;
    this._manual = null; this._ultimaEntrada = -Infinity;
    this._ignorarCliqueAte = 0; this._ultimoToque = null;
    this._repousoGesto = false; this._transicao = null;
    this._piscarInicio = null;
    const agora = performance.now();
    this.ultimoInput = agora; this._quietoDesde = agora; this._ultimoQuadro = agora;
    this._olharTempo = agora;
    this._proximaPiscada = agora + rand(...this.piscadaIntervalo);
    this._proximoIdle = agora + this.idleApos;
    this._limparGesto();
    this._medir();
    this.ligarEventos();
    this._quadro = agora => {
      this._raf = null;
      if (this.destruido || document.hidden) return;
      this._iniciar();
      this._atualizarEstado(agora);
      this.atualizar(false, agora);
      if (this.destruido) return; // onPose pode desmontar o componente.
      this._renderizar(agora);
      this._animarCorpo(agora);
      this._ultimoQuadro = agora;
    };
  }

  carregar() {
    if (this.destruido) return Promise.resolve(this);
    if (this._carregando) return this._carregando;
    const tarefas = POSES.map(p => new Promise(resolve => {
      const im = new Image();
      let terminou = false;
      const carga = { cancelar: () => concluir(false, true) };
      const concluir = (sucesso, cancelar = false) => {
        if (terminou) return;
        terminou = true;
        im.onload = im.onerror = null;
        this._cargas.delete(carga);
        if (sucesso && !this.destruido) this.img[p] = im;
        if (cancelar && im.removeAttribute) im.removeAttribute('src');
        resolve();
      };
      this._cargas.add(carga);
      im.onload = () => concluir(true);
      im.onerror = () => concluir(false);
      im.src = this.fontes?.[p] || `${this.pasta}${p}.${this.ext}`;
    }));
    this._carregando = Promise.all(tarefas).then(() => {
      if (this.destruido) return this;
      this.modoTeste = !this.img.rest;
      this._pronto = true;
      this._reiniciarRelogio(performance.now());
      this.atualizar(true);
      this._iniciar();
      return this;
    });
    return this._carregando;
  }

  /* ---------- estado: emoção > piscar > olhar ---------- */
  poseAtual() { return this.emocao || this.piscada || this.dir; }

  emote(nome, ms = this.cliqueDuracao) {
    if (this.destruido || !['grin','hearts','angry'].includes(nome)) return;
    const agora = performance.now();
    this._manual = { nome, ate: agora + Math.max(0,ms) };
    this._atualizarEstado(agora);
    this.atualizar(false, agora);
  }

  // API compatível: move somente o olhar. Reações gestuais vêm dos eventos.
  olharPara(clientX, clientY) {
    if (this.destruido) return;
    this._ponteiro = { x: clientX, y: clientY };
    this.dir = this._direcaoPara(clientX, clientY);
    this.atualizar();
  }

  _direcaoPara(x,y) {
    const r = this._rect;
    const dx = x - (r.left + r.width * this.centroX);
    const dy = y - (r.top + r.height * this.centroY);
    if (Math.hypot(dx,dy) < r.width * this.zonaMorta) return 'rest';
    const ang = (Math.atan2(dy,dx) + Math.PI * 2) % (Math.PI * 2);
    return SETORES[Math.round(ang / (Math.PI / 4)) % 8];
  }

  // O ponteiro indica o destino; a pose só muda após um pequeno tempo
  // de estabilização. Assim não há tremulação na fronteira dos 8 setores.
  _direcaoNatural(x,y,agora) {
    const r=this._rect;
    if (!r?.width) return this.dir;
    const cx=r.left+r.width*this.centroX, cy=r.top+r.height*this.centroY;
    const dt=limitar(agora-this._olharTempo,0,64);
    this._olharTempo=agora;
    const fator=1-Math.exp(-dt/165);
    this._olharX+=(x-cx-this._olharX)*fator;
    this._olharY+=(y-cy-this._olharY)*fator;
    const candidata=this._direcaoPara(cx+this._olharX,cy+this._olharY);
    if (candidata===this._olharPose) {
      this._olharCandidato=null;
      return this._olharPose;
    }
    if (candidata!==this._olharCandidato) {
      this._olharCandidato=candidata;
      this._olharCandidatoDesde=agora;
    } else if (agora-this._olharCandidatoDesde>=95) {
      this._olharPose=candidata;
      this._olharCandidato=null;
    }
    return this._olharPose;
  }

  _noRosto(x,y) {
    const r = this._rect;
    const nx = ((x-r.left)/r.width - this.centroX) / this.raioRostoX;
    const ny = ((y-r.top)/r.height - this.centroY) / this.raioRostoY;
    return nx*nx + ny*ny <= 1;
  }

  _limparGesto() {
    this._amostra = null;
    this._carinhoTempo = 0; this._ultimoCarinho = -Infinity;
    this._rapidos = []; this._viradas = [];
    this._vetorRapido = null; this._ultimaVirada = -Infinity;
  }

  _entrar(agora,x,y) {
    this._dentro = true; this._saidaEm = null; this._repousoGesto = false;
    this._quietoDesde = agora; this.ultimoInput = agora;
    this._ancoraQuieta = { x,y }; this._limparGesto();
    this._amostra = { x,y,t:agora };
    if (agora - this._ultimaEntrada >= this.entradaIntervalo) {
      this._sorrisoAte = agora + this.entradaDuracao;
      this._ultimaEntrada = agora;
    }
  }

  _sair(agora) {
    if (!this._dentro) return;
    this._dentro = false; this._saidaEm = agora;
    this._sorrisoAte = 0;
    this._limparGesto();
    // Um carinho já reconhecido conserva seu prazo de retorno de 1 s.
  }

  _receber(e) {
    if (this.destruido || document.hidden || e.isPrimary === false) return;
    const contato = e.pointerType === 'touch' || e.pointerType === 'pen';
    if (contato && this._pressionado?.id !== e.pointerId) return;
    if (!contato && this._pressionado && this._pressionado.tipo !== 'mouse') return;
    const agora = performance.now(), x = e.clientX, y = e.clientY;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    const anterior = this._ponteiro;
    this._ponteiro = { x,y };
    if (this._pressionado && anterior) {
      this._pressionado.percurso += Math.hypot(x-anterior.x,y-anterior.y) / this._rect.width;
    }
    const dentro = this._noRosto(x,y);
    if (dentro && !this._dentro) this._entrar(agora,x,y);
    else if (!dentro && this._dentro) this._sair(agora);

    if (!this._ancoraQuieta || Math.hypot(x-this._ancoraQuieta.x,y-this._ancoraQuieta.y) >= this._rect.width*this.limiarParado) {
      this._quietoDesde = agora; this.ultimoInput = agora;
      this._ancoraQuieta = {x,y}; this._repousoGesto = false;
      this._proximoIdle = agora + this.idleApos;
    }
    if (dentro) this._medirGesto(x,y,agora);
    this._atualizarEstado(agora);
    this.atualizar(false,agora);
  }

  _medirGesto(x,y,agora) {
    const a = this._amostra;
    if (!a) { this._amostra = {x,y,t:agora}; return; }
    const dt = agora-a.t;
    if (dt < this.amostraMin) return;
    if (dt > this.amostraMax) {
      this._limparGesto(); this._amostra = {x,y,t:agora}; return;
    }
    const dx=x-a.x, dy=y-a.y, d=Math.hypot(dx,dy)/this._rect.width;
    // Acumula subpixels até haver deslocamento útil; não transforma ruído em gesto.
    if (d < this.ruidoMovimento) return;
    this._amostra = {x,y,t:agora};
    const velocidade = d * 1000 / dt;
    if (velocidade >= this.carinhoVelMin && velocidade <= this.carinhoVelMax) {
      if (agora-this._ultimoCarinho > this.carinhoTolerancia) this._carinhoTempo = 0;
      this._carinhoTempo += dt;
      this._ultimoCarinho = agora;
      if (this._carinhoTempo >= this.carinhoApos) {
        this._carinhoAte = agora + this.carinhoRetorno;
        this._sorrisoAte = 0;
      }
    } else if (velocidade > this.carinhoVelMax || agora-this._ultimoCarinho > this.carinhoTolerancia) {
      this._carinhoTempo = 0;
    }

    const corte = agora-this.bravoJanela;
    this._rapidos = this._rapidos.filter(s=>s.fim>corte);
    this._viradas = this._viradas.filter(t=>t>corte);
    if (velocidade >= this.bravoVelMin) {
      this._rapidos.push({inicio:agora-dt,fim:agora});
      const v=this._vetorRapido;
      if (v && agora-v.t<=this.amostraMax) {
        const cos=(dx*v.x+dy*v.y)/(Math.hypot(dx,dy)*Math.hypot(v.x,v.y));
        if (cos<=Math.cos(this.bravoAngulo*Math.PI/180) && agora-this._ultimaVirada>=this.intervaloMudancas) {
          this._viradas.push(agora); this._ultimaVirada=agora;
        }
      }
      this._vetorRapido={x:dx,y:dy,t:agora};
      const tempo=this._rapidos.reduce((s,v)=>s+v.fim-Math.max(corte,v.inicio),0);
      if (tempo>=this.bravoApos && this._viradas.length>=this.bravoMudancas) {
        this._bravoAte=agora+this.bravoRetorno;
        this._carinhoAte=0; this._carinhoTempo=0; this._sorrisoAte=0;
      }
    }
  }

  _atualizarEstado(agora) {
    const fixo = this._dentro && agora-this._quietoDesde >= this.fixoApos;
    if (fixo !== this.fixo) {
      this.fixo = fixo;
      this._direcaoFixa = this.dir;
      this._proximaPiscada = agora+rand(...(fixo ? this.piscadaFixaIntervalo : this.piscadaIntervalo));
    }
    if (this._manual && agora>=this._manual.ate) this._manual=null;
    if (this._carinhoAte && agora>=this._carinhoAte) {
      this._carinhoAte=0;
      if (agora-this.ultimoInput>=this.carinhoTolerancia) this._repousoGesto=true;
    }
    // Ação explícita (clique/teclado) > bravo > carinho > cumprimento.
    this.emocao = this._manual?.nome || (agora<this._bravoAte ? 'angry' :
      agora<this._carinhoAte ? 'hearts' : agora<this._sorrisoAte ? 'grin' : null);

    const foraVenceu = this._saidaEm !== null && agora-this._saidaEm >= this.saidaRetorno;
    const ocioso = !this._dentro && agora-this.ultimoInput >= this.idleApos;
    if (ocioso && !this.reduzir && !this.emocao) {
      if (agora>=this._proximoIdle) {
        // Curiosidade natural: pequenas olhadas com pausas em repouso.
        const chance=Math.random();
        const destinos=chance<.36 ? ['rest'] :
          chance<.78 ? ['left','right','up','upleft','upright'] :
          ['downleft','downright','down'];
        this.dir=destinos[Math.floor(Math.random()*destinos.length)];
        this._proximoIdle=agora+rand(...this.idleIntervalo);
      }
    } else if (this._repousoGesto || foraVenceu || !this._ponteiro || (ocioso && this.reduzir)) {
      this.dir='rest';
    } else if (this.fixo) {
      this.dir=this._direcaoFixa;
    } else {
      this.dir=this._direcaoNatural(this._ponteiro.x,this._ponteiro.y,agora);
    }
    this._piscar(agora);
  }

  _piscar(agora) {
    const intervalo = this.fixo ? this.piscadaFixaIntervalo : this.piscadaIntervalo;
    if (this.emocao) {
      this.piscada=null; this._piscarInicio=null;
      this._duplaPiscada=false; this._segundaPiscada=false;
      if (this._proximaPiscada<=agora) this._proximaPiscada=agora+rand(...intervalo);
      return;
    }
    if (this._piscarInicio===null && agora>=this._proximaPiscada) {
      this._piscarInicio=agora;
      const fator=this._segundaPiscada ? rand(.73,.95) : rand(.82,1.2);
      this._piscarTempos=(this.fixo ? this.piscadaFixaDuracoes : this.piscadaDuracoes)
        .map(d=>Math.round(d*fator));
      if (!this._segundaPiscada) this._duplaPiscada=Math.random()<.11;
    }
    if (this._piscarInicio===null) { this.piscada=null; return; }
    const t=agora-this._piscarInicio, [a,b,c]=this._piscarTempos;
    this.piscada=t<a ? 'half' : t<a+b ? 'closed' : t<a+b+c ? 'half' : null;
    if (t>=a+b+c) {
      this._piscarInicio=null;
      if (this._duplaPiscada && !this._segundaPiscada) {
        this._duplaPiscada=false; this._segundaPiscada=true;
        this._proximaPiscada=agora+rand(115,200);
      } else {
        this._segundaPiscada=false;
        this._proximaPiscada=agora+rand(...intervalo);
      }
    }
  }

  /* ---------- entrada, toque e ciclo de vida ---------- */
  _escutar(alvo,tipo,fn,opcoes) {
    alvo.addEventListener(tipo,fn,opcoes);
    this._limpezas.push(()=>alvo.removeEventListener(tipo,fn,opcoes));
  }

  ligarEventos() {
    if (this._eventosLigados || this.destruido) return;
    this._eventosLigados=true;
    const passivo={passive:true};
    this._escutar(window,'pointermove',e=>this._receber(e),passivo);
    this._escutar(this.canvas,'pointerenter',e=>this._receber(e),passivo);
    this._escutar(this.canvas,'pointerleave',e=>{
      if (this._pressionado?.tipo==='touch' || this._pressionado?.tipo==='pen') return;
      this._receber(e); this._sair(performance.now());
    },passivo);
    this._escutar(this.canvas,'pointerdown',e=>{
      if (e.isPrimary===false || (e.button!==undefined && e.button!==0) || this._pressionado) return;
      const agora=performance.now();
      this._pressionado={id:e.pointerId,tipo:e.pointerType||'mouse',inicio:agora,percurso:0};
      this._ponteiro={x:e.clientX,y:e.clientY};
      if (e.pointerType==='touch' || e.pointerType==='pen') {
        try { this.canvas.setPointerCapture(e.pointerId); } catch (_) { /* Contato já encerrado. */ }
      }
      this._receber(e);
    },passivo);
    this._escutar(window,'pointerup',e=>this._soltar(e,false),passivo);
    this._escutar(window,'pointercancel',e=>this._soltar(e,true),passivo);
    this._escutar(this.canvas,'lostpointercapture',e=>this._soltar(e,true),passivo);
    this._escutar(this.canvas,'click',e=>{
      if (e.detail!==0 && performance.now()<this._ignorarCliqueAte) return;
      this.emote('grin',this.cliqueDuracao);
    });
    this._escutar(this.canvas,'dblclick',e=>{
      if (performance.now()<this._ignorarCliqueAte) return;
      this.emote('hearts',this.duploCliqueDuracao);
    });
    this._escutar(this.canvas,'keydown',e=>{
      if ((e.key==='Enter' || e.key===' ') && !e.repeat) {
        e.preventDefault();
        this.emote(e.shiftKey ? 'hearts' : 'grin',e.shiftKey ? this.duploCliqueDuracao : this.cliqueDuracao);
      }
    });

  /* ---------- desenho nítido + crossfade de 80 ms ---------- */
  _medir() {

  _renderizar(agora) {
